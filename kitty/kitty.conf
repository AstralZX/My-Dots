background            #0A0A0A
foreground            #E5E5E5
selection_background  #D0D0D0
selection_foreground  #0A0A0A
cursor                #F5F5F5

color0                #0A0A0A
color8                #555555
color1                #3A3A3A
color9                #5A5A5A
color2                #707070
color10               #8A8A8A
color3                #909090
color11               #A8A8A8
color4                #B0B0B0
color12               #C0C0C0
color5                #D0D0D0
color13               #D8D8D8
color6                #E0E0E0
color14               #E8E8E8
color7                #E5E5E5
color15               #FFFFFF

confirm_os_window_close 0

cursor_shape                 block
cursor_blink_interval        0.5
cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 0

hide_window_decorations      no
window_padding_width         12
disable_code_ligatures       never

font_family                  JetBrainsMono Nerd Font
font_size                    13.0
adjust_line_height           110%

font_features                JetBrainsMonoNF-Regular +zero +ss01 +ss02 +calt

background_opacity           0.95
background_blur              20

url_style                    curly
url_color                    #CFCFCF
detect_urls                  yes
open_url_with                default
modify_font                  underline_position 2
modify_font                  underline_thickness 150%

draw_minimal_borders         yes
window_border_width          1.5pt
active_border_color          #E5E5E5
inactive_border_color        #4A4A4A

tab_bar_edge                 bottom
tab_bar_margin_width         0.0
tab_bar_margin_height        0.0 0.0
tab_bar_style                powerline
tab_powerline_style          slanted
tab_bar_align                left
tab_bar_min_tabs             2

tab_title_template           " {index}: {title} "

active_tab_foreground        #0A0A0A
active_tab_background        #F2F2F2
active_tab_font_style        bold

inactive_tab_foreground      #C8C8C8
inactive_tab_background      #3A3A3A
inactive_tab_font_style      normal

tab_bar_background           #0A0A0A

enabled_layouts              splits,stack,fat,tall

scrollback_lines             10000
scrollback_pager             less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

map alt+v launch --location=vsplit --cwd=current
map alt+h launch --location=hsplit --cwd=current

map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down
map alt+k     neighboring_window up
map alt+j     neighboring_window down
map alt+h     neighboring_window left
map alt+l     neighboring_window right

map ctrl+alt+left  resize_window narrower 2
map ctrl+alt+right resize_window wider 2
map ctrl+alt+up    resize_window taller 2
map ctrl+alt+down  resize_window shorter 2

map alt+t new_tab_with_cwd
map alt+w close_window
map alt+shift+w close_tab
map alt+[ previous_tab
map alt+] next_tab

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

map alt+z toggle_layout stack
map alt+/ layout_action rotate

map alt+= change_font_size all +1.0
map alt+- change_font_size all -1.0
map alt+0 change_font_size all 0

map alt+f kitten hints --type path --program "launch --type=overlay nvim"
map alt+p kitten hints --type word --program insert
map alt+y kitten hints --type url --program @
map alt+g show_scrollback
map alt+escape kitty_shell window

sync_to_monitor              yes
repaint_delay                4
input_delay                  1
linux_display_server         auto
allow_remote_control         yes
